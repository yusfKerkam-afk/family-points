<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>FamilyPoints – Familien-Zentrale</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background: radial-gradient(circle at top right, #064e3b, #0f172a 55%, #020617);
      color: #f8fafc;
      min-height: 100vh;
    }
    .glass {
      background: rgba(30, 41, 59, 0.6);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .glass-card {
      background: linear-gradient(145deg, rgba(30, 41, 59, 0.85), rgba(15, 23, 42, 0.95));
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.14);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
    }
    .fade-in { animation: fadeIn 0.3s ease-out forwards; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .accordion-content {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.3s ease-out, opacity 0.3s ease-out;
      opacity: 0;
    }
    .accordion-content.open {
      max-height: 300px;
      opacity: 1;
    }
  </style>
</head>
<body class="antialiased selection:bg-emerald-500 selection:text-white">

  <div id="toast" class="fixed top-5 right-5 z-50 hidden glass px-4 py-3 rounded-xl text-sm font-medium shadow-2xl"></div>

  <!-- PROFIL MODAL -->
  <div id="profile-modal" class="fixed inset-0 z-50 hidden bg-black/70 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="glass-card w-full max-w-lg p-6 rounded-3xl relative fade-in max-h-[90vh] overflow-y-auto">
      <button onclick="closeProfileModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white text-lg px-2 py-1 bg-slate-800 rounded-xl">✕</button>
      <div id="profile-content"></div>
    </div>
  </div>

  <!-- LOGIN VIEW -->
  <div id="auth-view" class="min-h-screen flex items-center justify-center p-4">
    <div class="glass-card w-full max-w-md p-8 rounded-3xl fade-in">
      <div class="text-center mb-8">
        <div class="w-14 h-14 bg-emerald-500/20 border border-emerald-500/30 rounded-2xl flex items-center justify-center mx-auto mb-4 text-2xl">🏆</div>
        <h1 class="text-2xl font-bold tracking-tight">FamilyPoints</h1>
        <p class="text-slate-400 text-sm mt-1">Gemeinsam stark im Haushalt</p>
      </div>

      <form id="auth-form" class="space-y-4">
        <div>
          <label class="block text-xs font-medium text-slate-400 uppercase tracking-wider mb-1.5">E-Mail</label>
          <input type="email" id="email" required placeholder="name@familie.local"
            class="w-full px-4 py-3 rounded-xl bg-slate-900/80 border border-slate-700 focus:border-emerald-500 focus:outline-none text-white transition" />
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-400 uppercase tracking-wider mb-1.5">Passwort</label>
          <input type="password" id="password" required placeholder="••••••••"
            class="w-full px-4 py-3 rounded-xl bg-slate-900/80 border border-slate-700 focus:border-emerald-500 focus:outline-none text-white transition" />
        </div>
        <button type="submit"
          class="w-full py-3.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 active:scale-[0.99] font-semibold text-white shadow-lg shadow-emerald-600/30 transition">
          Einloggen
        </button>
      </form>
    </div>
  </div>

  <!-- MAIN APP VIEW -->
  <div id="app-view" class="hidden min-h-screen flex flex-col max-w-7xl mx-auto p-4 sm:p-6">
    <header class="glass rounded-2xl px-5 py-3.5 flex items-center justify-between mb-6">
      <div class="flex items-center gap-3">
        <span class="text-xl">🏆</span>
        <span class="font-bold text-lg tracking-tight">FamilyPoints</span>
        <span class="hidden sm:inline-flex items-center gap-1.5 text-xs bg-emerald-500/15 text-emerald-300 border border-emerald-500/30 px-2.5 py-0.5 rounded-full">
          <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span> Live
        </span>
      </div>
      <div class="flex items-center gap-3">
        <span id="current-user-badge" class="text-xs font-semibold px-3 py-1 rounded-lg bg-slate-800 text-emerald-300"></span>
        <button onclick="logout()" class="text-xs px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 transition">
          Abmelden
        </button>
      </div>
    </header>

    <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
      
      <!-- LINKS: To-Do-Liste / Notizen & Chat -->
      <div class="lg:col-span-3 space-y-6">
        <section class="glass rounded-3xl p-5">
          <div class="flex items-center justify-between mb-3">
            <h2 class="text-sm font-bold flex items-center gap-1.5">📌 Familien-Notizen</h2>
          </div>
          <form id="todo-form" class="flex gap-2 mb-3">
            <input type="text" id="todo-input" required placeholder="Neue Notiz / To-Do..."
              class="flex-1 px-3 py-2 rounded-xl bg-slate-900/80 border border-slate-700 focus:border-emerald-500 focus:outline-none text-xs text-white" />
            <button type="submit" class="px-3 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-xs font-bold">+</button>
          </form>
          <div id="todo-list" class="space-y-2 max-h-48 overflow-y-auto pr-1"></div>
        </section>

        <section class="glass rounded-3xl p-5 flex flex-col h-[350px]">
          <h2 class="text-sm font-bold mb-3 flex items-center gap-1.5">💬 Familien-Chat</h2>
          <div id="chat-messages" class="flex-1 overflow-y-auto space-y-2 pr-1 mb-3 text-xs"></div>
          <form id="chat-form" class="flex gap-2">
            <input type="text" id="chat-input" required placeholder="Nachricht..."
              class="flex-1 px-3 py-2 rounded-xl bg-slate-900/80 border border-slate-700 focus:border-emerald-500 focus:outline-none text-xs text-white" />
            <button type="submit" class="px-3 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-xs font-bold">Senden</button>
          </form>
        </section>
      </div>

      <!-- MITTE: Aufgaben & Bestenliste -->
      <div class="lg:col-span-6 space-y-6">
        <section class="glass-card rounded-3xl p-6">
          <div class="flex items-center justify-between mb-4">
            <h2 class="text-lg font-bold flex items-center gap-2">🥇 Familien-Bestenliste</h2>
            <span class="text-xs text-slate-400">Monatlich (Auto-Reset)</span>
          </div>
          <div id="leaderboard-list" class="space-y-3"></div>
        </section>

        <section class="glass rounded-3xl p-6">
          <h2 class="text-lg font-bold mb-1">✅ Aufgabe erledigen</h2>
          <p class="text-xs text-slate-400 mb-4">Wähle eine Kategorie oder Unterkategorie:</p>
          
          <div id="tasks-container" class="space-y-3 mb-5"></div>

          <div class="pt-4 border-t border-slate-700/70">
            <label class="block text-xs font-medium text-slate-300 mb-2">
              Eigene Aufgabe eintragen <span class="text-emerald-400 font-bold">(+15 Points)</span>
            </label>
            <form id="custom-task-form" class="flex gap-2">
              <input type="text" id="custom-task-input" required placeholder="z. B. Blumen gegossen..."
                class="flex-1 px-4 py-2.5 rounded-xl bg-slate-900/80 border border-slate-700 focus:border-emerald-500 focus:outline-none text-sm text-white" />
              <button type="submit"
                class="px-5 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 active:scale-95 font-semibold text-sm transition whitespace-nowrap">
                Eintragen
              </button>
            </form>
          </div>
        </section>
      </div>

      <!-- RECHTS: Aktivitäten-Verlauf -->
      <div class="lg:col-span-3">
        <section class="glass rounded-3xl p-5 h-full flex flex-col">
          <div class="flex items-center justify-between mb-4">
            <h2 class="text-sm font-bold">📜 Verlauf</h2>
          </div>
          <div id="activity-feed" class="space-y-2.5 overflow-y-auto max-h-[600px] pr-1 text-xs"></div>
        </section>
      </div>

    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://gnebmmsararwepwpoeek.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_cUtMwo3RBXrT1cbVSbZsWw_36iYbSXD';
    
    const TASK_CATEGORIES = [
      {
        title: '🍳 Beim Essen bereiten helfen',
        points: 25,
        sub: []
      },
      {
        title: '🚽 Toilette putzen',
        points: 40,
        sub: []
      },
      {
        title: '🧽 Staub wischen',
        points: 20,
        sub: []
      },
      {
        title: '🧹 Boden wischen / Staub saugen',
        points: 30,
        sub: []
      },
      {
        title: '🧺 Wäsche (Oberkategorie)',
        isAccordion: true,
        subtasks: [
          { title: 'Wäsche in Waschmaschine', points: 15 },
          { title: 'Wäsche aufhängen', points: 20 }
        ]
      }
    ];

    const USER_DISPLAY_NAMES = {
      'mama@familie.local': 'Mama',
      'papa@familie.local': 'Papa',
      'yusfkemler@gmail.com': 'Yusuf'
    };

    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    let currentUser = null;
    let allTasks = [];
    let chatMessages = [];
    let todos = [];

    function getDisplayName(email) {
      if (USER_DISPLAY_NAMES[email]) return USER_DISPLAY_NAMES[email];
      const rawName = email.split('@')[0];
      return rawName.charAt(0).toUpperCase() + rawName.slice(1);
    }

    function showToast(msg, isError = false) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.className = `fixed top-5 right-5 z-50 px-4 py-3 rounded-xl text-sm font-medium shadow-2xl transition-all ${isError ? 'bg-red-900/90 border border-red-500 text-red-100' : 'glass text-emerald-300 border-emerald-500/40'}`;
      t.classList.remove('hidden');
      setTimeout(() => t.classList.add('hidden'), 3500);
    }

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }

    document.getElementById('auth-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const { error } = await db.auth.signInWithPassword({ email, password });
      if (error) return showToast('Zugang verweigert: ' + error.message, true);
    });

    async function logout() {
      await db.auth.signOut();
    }

    db.auth.onAuthStateChange(async (event, session) => {
      if (session?.user) {
        currentUser = session.user;
        document.getElementById('auth-view').classList.add('hidden');
        document.getElementById('app-view').classList.remove('hidden');
        document.getElementById('current-user-badge').textContent = '👤 ' + getDisplayName(currentUser.email);
        renderCategories();
        await loadAllData();
        subscribeToRealtime();
      } else {
        currentUser = null;
        document.getElementById('auth-view').classList.remove('hidden');
        document.getElementById('app-view').classList.add('hidden');
      }
    });

    function renderCategories() {
      const container = document.getElementById('tasks-container');
      container.innerHTML = TASK_CATEGORIES.map((cat, idx) => {
        if (cat.isAccordion) {
          return `
            <div class="border border-slate-700/80 rounded-2xl bg-slate-800/40 overflow-hidden">
              <button onclick="toggleAccordion(${idx})" class="w-full p-3.5 flex items-center justify-between text-left hover:bg-slate-800/80 transition">
                <span class="text-sm font-medium text-slate-100">${cat.title}</span>
                <span class="text-xs text-emerald-400 font-bold">▼ Aufklappen</span>
              </button>
              <div id="accordion-${idx}" class="accordion-content px-3 pb-3 space-y-2">
                ${cat.subtasks.map(sub => `
                  <button onclick="addTask('${escapeHtml(sub.title)}', ${sub.points})"
                    class="w-full p-2.5 rounded-xl bg-slate-900/60 hover:bg-emerald-600/20 border border-slate-700/50 flex items-center justify-between text-left transition">
                    <span class="text-xs text-slate-200">↳ ${escapeHtml(sub.title)}</span>
                    <span class="text-xs font-bold text-emerald-300">+${sub.points} Pkt</span>
                  </button>
                `).join('')}
              </div>
            </div>
          `;
        } else {
          return `
            <button onclick="addTask('${escapeHtml(cat.title)}', ${cat.points})"
              class="w-full p-3.5 rounded-2xl bg-slate-800/80 hover:bg-emerald-600/20 border border-slate-700 hover:border-emerald-500/50 active:scale-[0.98] transition flex items-center justify-between text-left group">
              <span class="text-sm font-medium text-slate-100 group-hover:text-white">${escapeHtml(cat.title)}</span>
              <span class="text-xs font-bold px-2.5 py-1 rounded-lg bg-emerald-500/20 text-emerald-300 ml-2 whitespace-nowrap">+${cat.points} Pkt</span>
            </button>
          `;
        }
      }).join('');
    }

    function toggleAccordion(idx) {
      const el = document.getElementById(`accordion-${idx}`);
      el.classList.toggle('open');
    }

    async function loadAllData() {
      // Aufgaben laden
      const { data: tasksData } = await db.from('family_tasks').select('*').order('created_at', { ascending: false });
      allTasks = tasksData || [];
      renderLeaderboard();
      renderActivityFeed();

      // Chat laden
      const { data: chatData } = await db.from('family_chat').select('*').order('created_at', { ascending: true }).limit(50);
      chatMessages = chatData || [];
      renderChat();

      // To-Dos laden
      const { data: todoData } = await db.from('family_todos').select('*').order('created_at', { ascending: false });
      todos = todoData || [];
      renderTodos();
    }

    function subscribeToRealtime() {
      db.channel('family-main-channel')
        .on('postgres_changes', { event: '*', schema: 'public' }, () => {
          loadAllData();
        })
        .subscribe();
    }

    // Aufgabe hinzufügen
    document.getElementById('custom-task-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const input = document.getElementById('custom-task-input');
      const title = input.value.trim();
      if (!title) return;
      await addTask('✨ ' + title, 15);
      input.value = '';
    });

    async function addTask(taskTitle, points) {
      const userName = getDisplayName(currentUser.email);
      const { error } = await db.from('family_tasks').insert([{
        user_id: currentUser.id,
        user_name: userName,
        task_title: taskTitle,
        points: points
      }]);
      if (error) return showToast('Fehler: ' + error.message, true);
      showToast(`+${points} Points für ${userName}!`);
    }

    // To-Do / Notizen
    document.getElementById('todo-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const input = document.getElementById('todo-input');
      const text = input.value.trim();
      if (!text) return;
      await db.from('family_todos').insert([{ text, created_by: getDisplayName(currentUser.email) }]);
      input.value = '';
    });

    async function deleteTodo(id) {
      await db.from('family_todos').delete().eq('id', id);
    }

    function renderTodos() {
      const container = document.getElementById('todo-list');
      if (todos.length === 0) {
        container.innerHTML = `<p class="text-[11px] text-slate-500 text-center py-2">Keine offenen Notizen.</p>`;
        return;
      }
      container.innerHTML = todos.map(t => `
        <div class="flex items-center justify-between bg-slate-900/60 p-2.5 rounded-xl border border-slate-800 text-xs">
          <span class="text-slate-200">${escapeHtml(t.text)}</span>
          <button onclick="deleteTodo('${t.id}')" class="text-emerald-400 hover:text-emerald-300 font-bold px-2 py-0.5 bg-emerald-950/50 rounded-lg">✓ Abhaken</button>
        </div>
      `).join('');
    }

    // Chat
    document.getElementById('chat-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const input = document.getElementById('chat-input');
      const message = input.value.trim();
      if (!message) return;
      await db.from('family_chat').insert([{
        user_name: getDisplayName(currentUser.email),
        message: message
      }]);
      input.value = '';
    });

    function renderChat() {
      const container = document.getElementById('chat-messages');
      container.innerHTML = chatMessages.map(m => `
        <div>
          <span class="font-bold text-emerald-400">${escapeHtml(m.user_name)}:</span>
          <span class="text-slate-300">${escapeHtml(m.message)}</span>
        </div>
      `).join('');
      container.scrollTop = container.scrollHeight;
    }

    // Bestenliste mit monatlichem Reset & Klick auf Profil
    function renderLeaderboard() {
      const now = new Date();
      const currentMonth = now.getMonth();
      const currentYear = now.getFullYear();

      // Filtere Aufgaben für den aktuellen Monat (für monatlichen Punktestand)
      const monthlyScores = {};
      allTasks.forEach(t => {
        const d = new Date(t.created_at);
        if (d.getMonth() === currentMonth && d.getFullYear() === currentYear) {
          if (!monthlyScores[t.user_name]) monthlyScores[t.user_name] = 0;
          monthlyScores[t.user_name] += t.points;
        }
      });

      const sorted = Object.entries(monthlyScores)
        .map(([name, points]) => ({ name, points }))
        .sort((a, b) => b.points - a.points);

      const container = document.getElementById('leaderboard-list');
      if (sorted.length === 0) {
        container.innerHTML = `<p class="text-sm text-slate-400 text-center py-4">Noch keine Punkte in diesem Monat. Starte als Erster!</p>`;
        return;
      }

      const medals = ['🥇', '🥈', '🥉'];
      container.innerHTML = sorted.map((entry, idx) => {
        const medal = medals[idx] || `#${idx + 1}`;
        const isFirst = idx === 0;
        return `
          <div onclick="openProfile('${entry.name}')" class="cursor-pointer p-4 rounded-2xl flex items-center justify-between ${isFirst ? 'bg-gradient-to-r from-amber-500/20 to-emerald-500/10 border border-amber-400/40' : 'bg-slate-800/60 border border-slate-700/60'} hover:border-emerald-500 transition">
            <div class="flex items-center gap-3">
              <span class="text-xl w-7 text-center font-bold">${medal}</span>
              <span class="font-bold text-base ${isFirst ? 'text-amber-200' : 'text-white'}">${escapeHtml(entry.name)}</span>
            </div>
            <div class="text-right">
              <span class="text-lg font-extrabold text-emerald-400">${entry.points}</span>
              <span class="text-xs text-slate-400 ml-1">Punkte (Monat)</span>
            </div>
          </div>
        `;
      }).join('');
    }

    // Profil Modal öffnen mit Statistiken
    function openProfile(userName) {
      const modal = document.getElementById('profile-modal');
      const content = document.getElementById('profile-content');

      const userTasks = allTasks.filter(t => t.user_name === userName);
      const totalPoints = userTasks.reduce((acc, curr) => acc + curr.points, 0);

      // Statistiken berechnen
      const taskCounts = {};
      userTasks.forEach(t => {
        taskCounts[t.task_title] = (taskCounts[t.task_title] || 0) + 1;
      });
      const favoriteTask = Object.entries(taskCounts).sort((a,b) => b[1] - a[1])[0]?.[0] || 'Noch keine';

      const now = new Date();
      const weekAgo = new Date(now.getTime() - 7 * 24 * 60 * 60 * 1000);
      const weeklyTasks = userTasks.filter(t => new Date(t.created_at) >= weekAgo);

      content.innerHTML = `
        <div class="text-center mb-6">
          <div class="w-16 h-16 bg-emerald-500/20 border border-emerald-500/40 rounded-full flex items-center justify-center mx-auto mb-3 text-2xl">👤</div>
          <h2 class="text-xl font-bold">${escapeHtml(userName)}</h2>
          <p class="text-xs text-emerald-400 mt-1">Gesamtpunkte (Alle Zeit): ${totalPoints} Pkt</p>
        </div>

        <div class="grid grid-cols-2 gap-3 mb-6">
          <div class="glass p-3.5 rounded-2xl text-center">
            <span class="block text-xs text-slate-400">Lieblingsaufgabe</span>
            <span class="text-xs font-bold text-slate-200 mt-1 block truncate">${escapeHtml(favoriteTask)}</span>
          </div>
          <div class="glass p-3.5 rounded-2xl text-center">
            <span class="block text-xs text-slate-400">Aktivitäten (7 Tage)</span>
            <span class="text-sm font-extrabold text-emerald-400 mt-1 block">${weeklyTasks.length} erledigt</span>
          </div>
        </div>

        <h3 class="text-sm font-bold mb-3">📋 Letzte Aktivitäten von ${escapeHtml(userName)}</h3>
        <div class="space-y-2 max-h-48 overflow-y-auto pr-1">
          ${userTasks.length === 0 ? '<p class="text-xs text-slate-500 text-center py-4">Noch keine Aktivitäten.</p>' : ''}
          ${userTasks.slice(0, 15).map(t => {
            const dateStr = new Date(t.created_at).toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
            return `
              <div class="bg-slate-900/60 p-2.5 rounded-xl border border-slate-800 flex justify-between items-center text-xs">
                <div>
                  <p class="text-slate-200">${escapeHtml(t.task_title)}</p>
                  <span class="text-[10px] text-slate-500">${dateStr}</span>
                </div>
                <span class="text-emerald-300 font-bold">+${t.points} Pkt</span>
              </div>
            `;
          }).join('')}
        </div>
      `;

      modal.classList.remove('hidden');
    }

    function closeProfileModal() {
      document.getElementById('profile-modal').classList.add('hidden');
    }

    function renderActivityFeed() {
      const feed = document.getElementById('activity-feed');
      const recent = allTasks.slice(0, 30);
      if (recent.length === 0) {
        feed.innerHTML = `<p class="text-xs text-slate-500 text-center py-8">Hier erscheint live der Verlauf.</p>`;
        return;
      }

      feed.innerHTML = recent.map(t => {
        const timeStr = new Date(t.created_at).toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
        return `
          <div class="p-2.5 rounded-xl bg-slate-900/60 border border-slate-800 flex items-center justify-between gap-2">
            <div>
              <span class="font-bold text-emerald-400">${escapeHtml(t.user_name)}</span>
              <p class="text-slate-200">${escapeHtml(t.task_title)}</p>
            </div>
            <span class="text-emerald-300 font-bold whitespace-nowrap">+${t.points}</span>
          </div>
        `;
      }).join('');
    }
  </script>
</body>
</html>
