<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>FamilyPoints – Haushalts-Challenge</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background: radial-gradient(circle at top right, #064e3b, #0f172a 55%, #020617);
      color: #f8fafc;
      min-height: 100vh;
    }
    .glass {
      background: rgba(30, 41, 59, 0.6);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .glass-card {
      background: linear-gradient(145deg, rgba(30, 41, 59, 0.85), rgba(15, 23, 42, 0.95));
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.14);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
    }
    .fade-in { animation: fadeIn 0.3s ease-out forwards; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body class="antialiased selection:bg-emerald-500 selection:text-white">

  <!-- Toast Benachrichtigung -->
  <div id="toast" class="fixed top-5 right-5 z-50 hidden glass px-4 py-3 rounded-xl text-sm font-medium shadow-2xl"></div>

  <!-- LOGIN -->
  <div id="auth-view" class="min-h-screen flex items-center justify-center p-4">
    <div class="glass-card w-full max-w-md p-8 rounded-3xl fade-in">
      <div class="text-center mb-8">
        <div class="w-14 h-14 bg-emerald-500/20 border border-emerald-500/30 rounded-2xl flex items-center justify-center mx-auto mb-4 text-2xl">🏆</div>
        <h1 class="text-2xl font-bold tracking-tight">FamilyPoints</h1>
        <p class="text-slate-400 text-sm mt-1">Geschlossener Familien-Bereich</p>
      </div>

      <form id="auth-form" class="space-y-4">
        <div>
          <label class="block text-xs font-medium text-slate-400 uppercase tracking-wider mb-1.5">Familien-Login (E-Mail)</label>
          <input type="email" id="email" required placeholder="name@familie.local"
            class="w-full px-4 py-3 rounded-xl bg-slate-900/80 border border-slate-700 focus:border-emerald-500 focus:outline-none text-white transition" />
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-400 uppercase tracking-wider mb-1.5">Passwort</label>
          <input type="password" id="password" required placeholder="••••••••"
            class="w-full px-4 py-3 rounded-xl bg-slate-900/80 border border-slate-700 focus:border-emerald-500 focus:outline-none text-white transition" />
        </div>
        <button type="submit"
          class="w-full py-3.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 active:scale-[0.99] font-semibold text-white shadow-lg shadow-emerald-600/30 transition">
          Einloggen
        </button>
      </form>
      <p class="text-center text-xs text-slate-500 mt-6">Zugang nur für freigeschaltete Familienmitglieder.</p>
    </div>
  </div>

  <!-- HAUPT-APP -->
  <div id="app-view" class="hidden min-h-screen flex flex-col max-w-5xl mx-auto p-4 sm:p-6">
    
    <!-- Header -->
    <header class="glass rounded-2xl px-5 py-3.5 flex items-center justify-between mb-6">
      <div class="flex items-center gap-3">
        <span class="text-xl">🏆</span>
        <span class="font-bold text-lg tracking-tight">FamilyPoints</span>
        <span class="hidden sm:inline-flex items-center gap-1.5 text-xs bg-emerald-500/15 text-emerald-300 border border-emerald-500/30 px-2.5 py-0.5 rounded-full">
          <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span> Live
        </span>
      </div>
      <div class="flex items-center gap-3">
        <span id="current-user-badge" class="text-xs font-semibold px-3 py-1 rounded-lg bg-slate-800 text-emerald-300"></span>
        <button onclick="logout()" class="text-xs px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 transition">
          Abmelden
        </button>
      </div>
    </header>

    <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
      
      <!-- LINKE SPALTE -->
      <div class="lg:col-span-7 space-y-6">
        <section class="glass-card rounded-3xl p-6">
          <div class="flex items-center justify-between mb-4">
            <h2 class="text-lg font-bold flex items-center gap-2">🥇 Familien-Bestenliste</h2>
            <span class="text-xs text-slate-400">Echtzeit-Stand</span>
          </div>
          <div id="leaderboard-list" class="space-y-3"></div>
        </section>

        <section class="glass rounded-3xl p-6">
          <h2 class="text-lg font-bold mb-1">✅ Erledigte Aufgabe eintragen</h2>
          <p class="text-xs text-slate-400 mb-4">Tippe auf eine erledigte Aufgabe, um sofort Punkte zu sammeln:</p>
          
          <div id="predefined-tasks-grid" class="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-5"></div>

          <div class="pt-4 border-t border-slate-700/70">
            <label class="block text-xs font-medium text-slate-300 mb-2">
              Etwas anderes erledigt? <span id="custom-points-label" class="text-emerald-400 font-bold">(+900 Points)</span>
            </label>
            <form id="custom-task-form" class="flex gap-2">
              <input type="text" id="custom-task-input" required placeholder="z. B. Auto ausgesaugt, Blumen gegossen..."
                class="flex-1 px-4 py-2.5 rounded-xl bg-slate-900/80 border border-slate-700 focus:border-emerald-500 focus:outline-none text-sm" />
              <button type="submit"
                class="px-5 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 active:scale-95 font-semibold text-sm transition whitespace-nowrap">
                Eintragen
              </button>
            </form>
          </div>
        </section>
      </div>

      <!-- RECHTE SPALTE -->
      <div class="lg:col-span-5">
        <section class="glass rounded-3xl p-6 h-full flex flex-col">
          <div class="flex items-center justify-between mb-4">
            <h2 class="text-lg font-bold">📜 Aktivitäten-Verlauf</h2>
            <span class="text-xs text-slate-400">Letzte 30 Einträge</span>
          </div>
          <div id="activity-feed" class="space-y-2.5 overflow-y-auto max-h-[600px] pr-1"></div>
        </section>
      </div>

    </div>
  </div>

  <script>
    // Dein echtes Projekt und Key sind hier fest eingetragen:
    const SUPABASE_URL = 'https://gnebmmsararwepwpoeek.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_cUtMwo3RBXrT1cbVSbZsWw_36iYbSXD';
    
    const PREDEFINED_TASKS = [
      { title: '🍽️ Geschirr aufgeräumt / Spülmaschine', points: 1400 },
      { title: '🗑️ Müll rausgebracht', points: 800 },
      { title: '🧹 Staubgesaugt / Gefegt', points: 1600 },
      { title: '🍳 Für alle gekocht', points: 2000 },
      { title: '🛒 Einkauf erledigt', points: 1500 },
      { title: '🧺 Wäsche gemacht', points: 1200 }
    ];

    const CUSTOM_TASK_POINTS = 900;

    const USER_DISPLAY_NAMES = {
      'mama@familie.local': 'Mama',
      'papa@familie.local': 'Papa',
      'yusfkemler@gmail.com': 'Yusuf'
    };

    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    let currentUser = null;
    let allTasks = [];

    document.getElementById('custom-points-label').textContent = `(+${CUSTOM_TASK_POINTS} Points)`;

    function getDisplayName(email) {
      if (USER_DISPLAY_NAMES[email]) return USER_DISPLAY_NAMES[email];
      const rawName = email.split('@')[0];
      return rawName.charAt(0).toUpperCase() + rawName.slice(1);
    }

    function showToast(msg, isError = false) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.className = `fixed top-5 right-5 z-50 px-4 py-3 rounded-xl text-sm font-medium shadow-2xl transition-all ${isError ? 'bg-red-900/90 border border-red-500 text-red-100' : 'glass text-emerald-300 border-emerald-500/40'}`;
      t.classList.remove('hidden');
      setTimeout(() => t.classList.add('hidden'), 3500);
    }

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }

    document.getElementById('auth-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const { error } = await db.auth.signInWithPassword({ email, password });
      if (error) return showToast('Zugang verweigert: ' + error.message, true);
    });

    async function logout() {
      await db.auth.signOut();
    }

    db.auth.onAuthStateChange(async (event, session) => {
      if (session?.user) {
        currentUser = session.user;
        document.getElementById('auth-view').classList.add('hidden');
        document.getElementById('app-view').classList.remove('hidden');
        document.getElementById('current-user-badge').textContent = '👤 ' + getDisplayName(currentUser.email);
        renderPredefinedButtons();
        await loadAllTasks();
        subscribeToRealtime();
      } else {
        currentUser = null;
        document.getElementById('auth-view').classList.remove('hidden');
        document.getElementById('app-view').classList.add('hidden');
      }
    });

    function renderPredefinedButtons() {
      const grid = document.getElementById('predefined-tasks-grid');
      grid.innerHTML = PREDEFINED_TASKS.map((task) => `
        <button onclick="addTask('${task.title.replace(/'/g, "\\'")}', ${task.points})"
          class="p-3.5 rounded-2xl bg-slate-800/80 hover:bg-emerald-600/20 border border-slate-700 hover:border-emerald-500/50 active:scale-[0.98] transition flex items-center justify-between text-left group">
          <span class="text-sm font-medium text-slate-100 group-hover:text-white">${escapeHtml(task.title)}</span>
          <span class="text-xs font-bold px-2.5 py-1 rounded-lg bg-emerald-500/20 text-emerald-300 ml-2 whitespace-nowrap">+${task.points}</span>
        </button>
      `).join('');
    }

    document.getElementById('custom-task-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const input = document.getElementById('custom-task-input');
      const title = input.value.trim();
      if (!title) return;
      await addTask('✨ ' + title, CUSTOM_TASK_POINTS);
      input.value = '';
    });

    async function addTask(taskTitle, points) {
      const userName = getDisplayName(currentUser.email);
      const { error } = await db.from('family_tasks').insert([{
        user_id: currentUser.id,
        user_name: userName,
        task_title: taskTitle,
        points: points
      }]);
      if (error) return showToast('Fehler: ' + error.message, true);
      showToast(`+${points} Points für ${userName}!`);
    }

    async function deleteTask(id) {
      if (!confirm('Diesen Eintrag wirklich zurücknehmen?')) return;
      const { error } = await db.from('family_tasks').delete().eq('id', id);
      if (error) showToast('Konnte nicht gelöscht werden', true);
    }

    async function loadAllTasks() {
      const { data, error } = await db
        .from('family_tasks')
        .select('*')
        .order('created_at', { ascending: false });
      if (error) return showToast('Fehler beim Laden: ' + error.message, true);
      allTasks = data || [];
      renderLeaderboard();
      renderActivityFeed();
    }

    function subscribeToRealtime() {
      db.channel('family-live-channel')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'family_tasks' }, (payload) => {
          loadAllTasks();
          if (payload.eventType === 'INSERT' && payload.new.user_id !== currentUser.id) {
            showToast(`🔔 ${payload.new.user_name} hat "${payload.new.task_title}" erledigt (+${payload.new.points} Pkt.)!`);
          }
        })
        .subscribe();
    }

    function renderLeaderboard() {
      const scores = {};
      allTasks.forEach(t => {
        if (!scores[t.user_name]) scores[t.user_name] = 0;
        scores[t.user_name] += t.points;
      });
      const sorted = Object.entries(scores)
        .map(([name, points]) => ({ name, points }))
        .sort((a, b) => b.points - a.points);

      const container = document.getElementById('leaderboard-list');
      if (sorted.length === 0) {
        container.innerHTML = `<p class="text-sm text-slate-400 text-center py-4">Noch keine Punkte gesammelt. Trag unten die erste Aufgabe ein!</p>`;
        return;
      }

      const medals = ['🥇', '🥈', '🥉'];
      container.innerHTML = sorted.map((entry, idx) => {
        const medal = medals[idx] || `#${idx + 1}`;
        const isFirst = idx === 0;
        return `
          <div class="p-4 rounded-2xl flex items-center justify-between ${isFirst ? 'bg-gradient-to-r from-amber-500/20 to-emerald-500/10 border border-amber-400/40' : 'bg-slate-800/60 border border-slate-700/60'}">
            <div class="flex items-center gap-3">
              <span class="text-xl w-7 text-center font-bold">${medal}</span>
              <span class="font-bold text-base ${isFirst ? 'text-amber-200' : 'text-white'}">${escapeHtml(entry.name)}</span>
            </div>
            <div class="text-right">
              <span class="text-lg font-extrabold text-emerald-400">${entry.points.toLocaleString('de-DE')}</span>
              <span class="text-xs text-slate-400 ml-1">Points</span>
            </div>
          </div>
        `;
      }).join('');
    }

    function renderActivityFeed() {
      const feed = document.getElementById('activity-feed');
      const recent = allTasks.slice(0, 30);
      if (recent.length === 0) {
        feed.innerHTML = `<p class="text-sm text-slate-500 text-center py-8">Hier erscheint live, wer welche Aufgabe erledigt hat.</p>`;
        return;
      }

      feed.innerHTML = recent.map(t => {
        const date = new Date(t.created_at);
        const timeStr = date.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
        const dateStr = date.toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit' });
        const isOwn = t.user_id === currentUser.id;

        return `
          <div class="p-3.5 rounded-2xl bg-slate-900/60 border border-slate-800 flex items-center justify-between gap-2 fade-in">
            <div>
              <div class="flex items-center gap-2">
                <span class="text-xs font-bold text-emerald-400">${escapeHtml(t.user_name)}</span>
                <span class="text-[11px] text-slate-500">${dateStr} ${timeStr} Uhr</span>
              </div>
              <p class="text-sm text-slate-200 mt-0.5">${escapeHtml(t.task_title)}</p>
            </div>
            <div class="flex items-center gap-2">
              <span class="text-xs font-bold text-emerald-300 bg-emerald-950/80 border border-emerald-500/30 px-2.5 py-1 rounded-lg whitespace-nowrap">
                +${t.points}
              </span>
              ${isOwn ? `<button onclick="deleteTask('${t.id}')" class="text-slate-600 hover:text-red-400 text-xs p-1" title="Löschen">✕</button>` : ''}
            </div>
          </div>
        `;
      }).join('');
    }
  </script>
</body>
</html>
